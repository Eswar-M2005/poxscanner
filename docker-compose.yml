name: poxscanner

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:3000
      DEMO_MODE: auto
      PYTHONPATH: /app:/app/server
    volumes:
      - ./ml/artifacts/checkpoints:/app/ml/artifacts/checkpoints:ro

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

# Browser on the host calls http://localhost:8000 (published API port).
# NEXT_PUBLIC_API_BASE_URL is inlined at build time for the client bundle, so it
# must be a URL the browser can reach — not the Compose service hostname
# `http://server:8000`. Server-side fetches from inside the client container would
# need that internal hostname; this compose file is aimed at local browser use.
