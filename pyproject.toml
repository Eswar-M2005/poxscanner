[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poxscanner"
version = "0.1.0"
description = "Educational/research decision-support for binary skin-lesion image classification."
requires-python = ">=3.11"
authors = [{ name = "Pox Scanner" }]

[project.optional-dependencies]
ml = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml", "ml.*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests", "server/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["ml", "server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]
